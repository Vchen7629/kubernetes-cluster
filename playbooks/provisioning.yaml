---
# required dependencies for kubernetes to function
- name: OS configuration
  hosts: cluster
  become: true
  gather_facts: true
  roles:
    - bootstrap/cluster
  tags: [bootstrap, all_services]

# - name: Provision Load Balancer
#  hosts: cluster
#  become: true
#  gather_facts: true

- name: K3s Provisioning
  hosts: cluster
  become: true
  gather_facts: true
  roles:
    - bootstrap/k3s
    - bootstrap/helm
  serial:
    - 1
    - 2
    - 5
  tags: [bootstrap, all_services]

# these services are used by all tenants
- name: Core services Deployment
  hosts: server
  become: true
  gather_facts: true
  post_tasks:
    - name: Perform post-install tasks
      ansible.builtin.include_role:
        name: "{{ postinstall }}"
        tasks_from: postinstall
      loop:
        - bootstrap/argocd
        - networking/cilium
      loop_control:
        loop_var: postinstall

    - name: Deploy cert-manager (after Gateway API CRDs are installed)
      ansible.builtin.include_role:
        name: platform/cert_manager
  roles:
    - networking/cilium
    - bootstrap/argocd
    - platform/cert_manager
  tags: [core, all_services]

- name: Observability services Deployment
  hosts: server
  become: true
  gather_facts: true
  post_tasks:
    - name: Perform post-install tasks
      ansible.builtin.include_role:
        name: observability/metrics_server
        tasks_from: postinstall
  roles:
    - observability/victoria_metrics
    - observability/metrics_server
  tags: [core, observability, all_services]

- name: Networking services deployment (used by cyphria, cinesense)
  hosts: server
  become: true
  gather_facts: true
  roles:
    - networking/external_dns
  tags: [core, networking, all_services]

- name: Data layer deployment
  hosts: server
  become: true
  gather_facts: true
  roles:
    - data/postgres
    - data/valkey
  tags: [core, data, all_services]

# Tenant platform services
- name: Cyphria services
  hosts: server
  become: true
  gather_facts: true
  vars:
    cf_tunnel_name: cyphria
    cf_tunnel_hostname: cyphria.com
    cf_tunnel_service: "{{ cilium_map.gateway.frontend.ingress }}"
  roles:
    - networking/cloudflare_tunnel
    - tenants/cyphria/shared
    - platform/airflow
    - tenants/cyphria/frontend
    - tenants/cyphria/insights_api
    - tenants/cyphria/data_pipeline_ingestion
    - tenants/cyphria/data_pipeline_llm_summary
    - tenants/cyphria/data_pipeline_ranking_calculator
    - tenants/cyphria/data_pipeline_sentiment_analysis
  tags: [cyphria, tenants, all_services]

- name: Mosaic services
  hosts: server
  become: true
  gather_facts: true
  vars:
    cf_tunnel_name: mosaic
    cf_tunnel_hostname: api.mosaic.yourdomain.com
    cf_tunnel_service: https://cilium-gateway-mosaic-grpc-gateway.mosaic-grpc-gateway.svc.cluster.local:443
    cf_tunnel_origin_request:
      http2Origin: true
      noTLSVerify: true
  roles:
    - networking/cloudflare_tunnel
    - bootstrap/mosaic_storage
    - platform/nvidia_device_plugin
    - platform/ollama
    - tenants/mosaic/shared
    - tenants/mosaic/audio_transcription
    - tenants/mosaic/conversation_briefing
    - tenants/mosaic/face_detection
  tags: [mosaic, tenants, all_services]
