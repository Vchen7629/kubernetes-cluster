---
- name: OS configuration
  hosts: cluster
  become: true
  gather_facts: true
  roles:
    - bootstrap/cluster
  tags: cluster

#- name: Provision Load Balancer
#  hosts: cluster
#  become: true
#  gather_facts: true

- name: K3s Provisioning
  hosts: cluster
  become: true
  gather_facts: true
  roles:
    - bootstrap/k3s
    - bootstrap/helm
  serial:
    - 1
    - 2
    - 5
  tags: kubernetes

- name: ArgoCD deployed applications provisioning
  hosts: server
  become: true
  gather_facts: true
  post_tasks:
    - name: Perform post-install tasks
      ansible.builtin.include_role:
        name: "{{ postinstall }}"
        tasks_from: postinstall
      loop:
        - bootstrap/argocd
        - observability/metrics_server
        - networking/cilium
      loop_control:
        loop_var: postinstall
  roles:
    - networking/cilium
    - observability/victoria_metrics
    - bootstrap/argocd
    - observability/metrics_server
    - platform/cert_manager
    - platform/airflow
    - networking/cloudflare_tunnel
    - networking/external_dns
    - data/postgres
    - data/valkey
    - tenants/cyphria/frontend
  tags: charts
