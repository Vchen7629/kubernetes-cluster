---
- name: Reset Cluster - Server Apps
  hosts: server
  become: true
  gather_facts: true
  tasks:
    - name: Get packages information
      ansible.builtin.package_facts:

    - name: Reset application roles
      ansible.builtin.include_role:
        name: "{{ reset }}"
        tasks_from: reset
      loop:
        - platform/cert_manager
        - networking/cloudflare_tunnel
        - networking/external_dns
        - observability/victoria_metrics
        - data/postgres
        - bootstrap/argocd
        - networking/cilium
      loop_control:
        loop_var: reset

    - name: Reset cluster roles
      ansible.builtin.include_role:
        name: "{{ reset }}"
        tasks_from: reset
      loop:
        - bootstrap/cluster
        - bootstrap/k3s
      loop_control:
        loop_var: reset

- name: Reset Cluster - Agent
  hosts: agent
  become: true
  gather_facts: true
  tasks:
    - name: Get packages information
      ansible.builtin.package_facts:

    - name: Reset cluster roles
      ansible.builtin.include_role:
        name: "{{ reset }}"
        tasks_from: reset
      loop:
        - bootstrap/cluster
        - bootstrap/k3s
      loop_control:
        loop_var: reset

- name: Post Tasks
  hosts: cluster
  become: true
  gather_facts: false
  tasks:
    - name: Remove archived journal files
      ansible.builtin.command:
        cmd: journalctl --rotate --vacuum-time=1m30s
      changed_when: false
