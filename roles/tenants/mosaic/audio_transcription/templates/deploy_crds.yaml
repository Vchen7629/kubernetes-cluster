apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: 
  name: mosaic-audio-transcription
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec: 
  project: default
  source:
    repoURL: https://github.com/Vchen7629/kubernetes-cluster.git
    targetRevision: main
    path: manifests/tenants/mosaic/audio_transcription
    
  destination:
    server: https://kubernetes.default.svc
    namespace: mosaic-audio-transcription
  
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=false