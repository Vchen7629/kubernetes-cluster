---
- name: Role Facts
  ansible.builtin.import_role:
    name: bootstrap/k3s
    tasks_from: facts

- name: Reset mosaic face detection
  when: inventory_hostname in k3s_map.server.hosts
  block:
    - name: Delete ArgoCD Application (stops reconciliation)
      kubernetes.core.k8s:
        api_version: argoproj.io/v1alpha1
        kind: Application
        name: mosaic-face-detection
        namespace: argocd
        state: absent
        wait: true
        wait_timeout: 60
        kubeconfig: '{{ k3s_project.cluster.kubeconfig }}'
      ignore_errors: true

    - name: Delete CiliumNetworkPolicy custom resources
      ansible.builtin.shell: |
        kubectl delete ciliumnetworkpolicies.cilium.io -n mosaic-face-detection --all --timeout=30s 2>/dev/null || true
      environment:
        KUBECONFIG: '{{ k3s_project.cluster.kubeconfig }}'
      ignore_errors: true

    - name: Delete mosaic-face-detection namespace
      kubernetes.core.k8s:
        api_version: v1
        kind: Namespace
        name: mosaic-face-detection
        state: absent
        wait: false
        kubeconfig: '{{ k3s_project.cluster.kubeconfig }}'
      ignore_errors: true

    - name: Wait for namespace deletion
      ansible.builtin.shell: |
        for i in {1..15}; do
          if ! kubectl get namespace mosaic-face-detection 2>/dev/null; then
            echo "Namespace deleted successfully"
            exit 0
          fi
          echo "Waiting for namespace deletion (attempt $i/15)..."
          sleep 4
        done
        exit 1
      environment:
        KUBECONFIG: '{{ k3s_project.cluster.kubeconfig }}'
      register: ns_wait
      failed_when: false
      changed_when: false
      ignore_errors: true

    - name: Force cleanup stuck namespace (fallback)
      ansible.builtin.shell: |
        kubectl get ciliumnetworkpolicies.cilium.io -n mosaic-face-detection -o name 2>/dev/null | while read resource; do
          kubectl patch ${resource} -n mosaic-face-detection -p '{"metadata":{"finalizers":[]}}' --type=merge 2>/dev/null || true
        done
        kubectl get pods,pvc -n mosaic-face-detection -o name 2>/dev/null | xargs -r -I {} kubectl patch {} -n mosaic-face-detection -p '{"metadata":{"finalizers":[]}}' --type=merge 2>/dev/null || true
        kubectl patch namespace mosaic-face-detection -p '{"metadata":{"finalizers":[]}}' --type=merge 2>/dev/null || true
        sleep 5
        if kubectl get namespace mosaic-face-detection 2>/dev/null; then
          echo "WARNING: Namespace still exists after force cleanup"
        else
          echo "Namespace successfully deleted"
        fi
      environment:
        KUBECONFIG: '{{ k3s_project.cluster.kubeconfig }}'
      when: ns_wait.rc != 0
      ignore_errors: true
