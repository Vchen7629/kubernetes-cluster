apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: 
  name: mosaic-grpc-gateway
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec: 
  project: default
  source:
    repoURL: https://github.com/Vchen7629/kubernetes-cluster.git
    targetRevision: main
    path: manifests/tenants/mosaic/grpc_gateway
    
  destination:
    server: https://kubernetes.default.svc
    namespace: mosaic
  
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=false