---
- name: Role Facts
  ansible.builtin.import_role:
    name: bootstrap/k3s
    tasks_from: facts

- name: Role Reset
  when: inventory_hostname in k3s_map.server.hosts
  block:
    - name: Delete ArgoCD Application (stops reconciliation)
      kubernetes.core.k8s:
        api_version: argoproj.io/v1alpha1
        kind: Application
        name: mosaic-grpc-gateway
        namespace: argocd
        state: absent
        wait: true
        wait_timeout: 120
        kubeconfig: '{{ k3s_project.cluster.kubeconfig }}'
      ignore_errors: true

    - name: Delete application namespace
      kubernetes.core.k8s:
        api_version: v1
        kind: Namespace
        name: mosaic-grpc-gateway
        state: absent
        kubeconfig: '{{ k3s_project.cluster.kubeconfig }}'
        wait: false
      ignore_errors: true

    - name: Wait for application namespace deletion
      ansible.builtin.shell: |
        for i in {1..15}; do
          if ! kubectl get namespace mosaic-grpc-gateway 2>/dev/null; then
            echo "Namespace deleted successfully"
            exit 0
          fi
          echo "Waiting for namespace deletion (attempt $i/15)..."
          sleep 4
        done
        exit 1
      environment:
        KUBECONFIG: '{{ k3s_project.cluster.kubeconfig }}'
      register: ns_wait
      failed_when: false
      changed_when: false
      ignore_errors: true

    - name: Force cleanup stuck namespace (fallback)
      ansible.builtin.shell: |
        echo "Namespace is stuck, applying force cleanup..."

        # Remove namespace finalizer
        kubectl patch namespace mosaic-grpc-gateway -p '{"metadata":{"finalizers":[]}}' --type=merge 2>/dev/null || true

        # Final verification
        sleep 5
        if kubectl get namespace mosaic-grpc-gateway 2>/dev/null; then
          echo "WARNING: Namespace still exists after force cleanup"
        else
          echo "Namespace successfully deleted"
        fi
      environment:
        KUBECONFIG: '{{ k3s_project.cluster.kubeconfig }}'
      when: ns_wait.rc != 0
      ignore_errors: true