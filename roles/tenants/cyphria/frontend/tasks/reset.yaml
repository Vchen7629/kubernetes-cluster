- name: Delete Frontend DNS
  kubernetes.core.k8s:
    state: absent
    api_version: externaldns.k8s.io/v1alpha1
    kind:  DNSEndpoint
    name: cyphria-frontend-dns
    namespace: frontend

- name: Uninstall frontend application in argocd
  kubernetes.core.k8s:
    api_version: argoproj.io/v1alpha1
    state: absent
    kind: Application
    name: cyphria-frontend
    namespace: argocd