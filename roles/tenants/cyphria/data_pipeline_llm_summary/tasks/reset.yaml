---
- name: Delete api key secret for data ingestion
  kubernetes.core.k8s:
    state: absent
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: llm-api-key
        namespace: cyphria-data-pipeline

- name: Uninstall llm summary application in argocd
  kubernetes.core.k8s:
    api_version: argoproj.io/v1alpha1
    state: absent
    kind: Application
    name: cyphria-llm-summary
    namespace: argocd
