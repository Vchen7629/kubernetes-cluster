apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: 
  name: cyphria-insights-api
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec: 
  project: default
  source:
    repoURL: https://github.com/Vchen7629/kubernetes-cluster.git
    targetRevision: main
    path: manifests/tenants/cyphria/insights_api
    
  destination:
    server: https://kubernetes.default.svc
    namespace: cyphria-backend
  
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=false