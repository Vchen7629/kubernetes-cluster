---
- name: Fully reset nvidia-device-plugin
  block:
    - name: Remove nvidia default runtime config
      ansible.builtin.file:
        path: /var/lib/rancher/k3s/agent/etc/containerd/config-v3.toml.d/nvidia-default.toml
        state: absent
      become: true
      ignore_errors: true

    - name: Remove nvidia-container-toolkit package
      ansible.builtin.apt:
        name: nvidia-container-toolkit
        state: absent
      become: true
      ignore_errors: true

    - name: Delete ArgoCD Application (stops reconciliation)
      kubernetes.core.k8s:
        api_version: argoproj.io/v1alpha1
        kind: Application
        name: nvidia-device-plugin
        namespace: argocd
        state: absent
        wait: true
        wait_timeout: 60
        kubeconfig: /etc/rancher/k3s/k3s.yaml
      ignore_errors: true

    - name: Delete nvidia-device-plugin namespace
      kubernetes.core.k8s:
        api_version: v1
        kind: Namespace
        name: nvidia-device-plugin
        state: absent
        wait: true
        wait_timeout: 60
        kubeconfig: /etc/rancher/k3s/k3s.yaml
      ignore_errors: true
