---
- name: Role Facts
  ansible.builtin.include_role:
    name: "{{ role }}"
    tasks_from: facts
  loop:
    - platform/nvidia_device_plugin
    - bootstrap/k3s
  loop_control:
    loop_var: role

- name: Install NVIDIA Container Toolkit
  when: inventory_hostname in k3s_vars.nodes.gpu.hosts
  become: true
  block:
    - name: Add NVIDIA Container Toolkit apt key
      ansible.builtin.get_url:
        url: https://nvidia.github.io/libnvidia-container/gpgkey
        dest: /usr/share/keyrings/nvidia-container-toolkit-keyring.asc
        mode: "0644"

    - name: Add NVIDIA Container Toolkit apt repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit-keyring.asc] https://nvidia.github.io/libnvidia-container/stable/deb/$(ARCH) /"
        filename: nvidia-container-toolkit
        state: present

    - name: Install nvidia-container-toolkit package
      ansible.builtin.apt:
        name: nvidia-container-toolkit
        state: present
        update_cache: true

    - name: Ensure containerd config drop-in directory exists
      ansible.builtin.file:
        path: /var/lib/rancher/k3s/agent/etc/containerd/config-v3.toml.d
        state: directory
        mode: "0755"

    - name: Set nvidia as default containerd runtime for k3s
      ansible.builtin.copy:
        dest: /var/lib/rancher/k3s/agent/etc/containerd/config-v3.toml.d/nvidia-default.toml
        content: |
          [plugins.'io.containerd.cri.v1.runtime'.containerd]
            default_runtime_name = "nvidia"
        mode: "0644"

    - name: Restart k3s so it auto-detects NVIDIA runtime
      ansible.builtin.service:
        name: k3s
        state: restarted

- name: Deploy to argocd
  when: inventory_hostname in k3s_map.server.hosts
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('ansible.builtin.template', 'argocd-deployment.yaml') | from_yaml }}"
    kubeconfig: /etc/rancher/k3s/k3s.yaml
