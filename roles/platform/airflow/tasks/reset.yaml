---
- name: Delete ArgoCD Application (stops reconciliation)
  kubernetes.core.k8s:
    api_version: argoproj.io/v1alpha1
    kind: Application
    name: airflow
    namespace: argocd
    state: absent
    wait: true
    wait_timeout: 60
    kubeconfig: /etc/rancher/k3s/k3s.yaml
  ignore_errors: true

- name: delete postgres crds
  block:
    - name: Delete CNPG cluster (operator handles graceful shutdown)
      kubernetes.core.k8s:
        api_version: postgresql.cnpg.io/v1
        kind: Cluster
        name: airflow-metadata-postgres-cluster
        namespace: postgres
        state: absent
        wait: false
        kubeconfig: "{{ k3s_project.cluster.kubeconfig }}"
      ignore_errors: true
    
    - name: Wait for CNPG cluster deletion
      ansible.builtin.shell: |
        for i in {1..30}; do
          if ! kubectl get cluster airflow-metadata-postgres-cluster -n postgres 2>/dev/null; then
            echo "Cluster deleted successfully"
            exit 0
          fi
          echo "Waiting for cluster deletion (attempt $i/30)..."
          sleep 10
        done
        exit 1
      environment:
        KUBECONFIG: "{{ k3s_project.cluster.kubeconfig }}"
      register: cluster_wait
      failed_when: false
      changed_when: false
      ignore_errors: true
    
    - name: Delete Airflow schema configmap
      kubernetes.core.k8s:
        api_version: v1
        kind: ConfigMap
        name: airflow-init-schema
        namespace: postgres
        state: absent
        kubeconfig: "{{ k3s_project.cluster.kubeconfig }}"
      ignore_errors: true
    
    - name: Delete airflow database user secret
      kubernetes.core.k8s:
        api_version: v1
        kind: Secret
        name: airflow-metadata-secret
        namespace: postgres
        state: absent
        kubeconfig: "{{ k3s_project.cluster.kubeconfig }}"
      ignore_errors: true

- name: Reset Airflow service
  block:
    - name: Delete CiliumNetworkPolicy custom resources
      ansible.builtin.shell: |
        kubectl delete ciliumnetworkpolicies.cilium.io -n airflow --all --timeout=30s 2>/dev/null || true
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      ignore_errors: true

    - name: Delete airflow namespace
      kubernetes.core.k8s:
        api_version: v1
        kind: Namespace
        name: airflow
        state: absent
        wait: false
        kubeconfig: /etc/rancher/k3s/k3s.yaml
      ignore_errors: true

    - name: Wait for namespace deletion
      ansible.builtin.shell: |
        for i in {1..15}; do
          if ! kubectl get namespace airflow 2>/dev/null; then
            echo "Namespace deleted successfully"
            exit 0
          fi
          echo "Waiting for namespace deletion (attempt $i/15)..."
          sleep 4
        done
        exit 1
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      register: ns_wait
      failed_when: false
      changed_when: false

    # Fallback - force cleanup if namespace is stuck
    - name: Force cleanup stuck namespace (fallback)
      ansible.builtin.shell: |
        echo "Namespace is stuck, applying force cleanup..."

        # Remove finalizers from any remaining CiliumNetworkPolicy resources
        kubectl get ciliumnetworkpolicies.cilium.io -n airflow -o name 2>/dev/null | while read resource; do
          kubectl patch ${resource} -n airflow -p '{"metadata":{"finalizers":[]}}' --type=merge 2>/dev/null || true
        done

        # Remove finalizers from stuck pods/pvcs
        kubectl get pods,pvc -n airflow -o name 2>/dev/null | xargs -r -I {} kubectl patch {} -n airflow -p '{"metadata":{"finalizers":[]}}' --type=merge 2>/dev/null || true

        # Remove namespace finalizer
        kubectl patch namespace airflow -p '{"metadata":{"finalizers":[]}}' --type=merge 2>/dev/null || true

        # Final verification
        sleep 5
        if kubectl get namespace airflow 2>/dev/null; then
          echo "WARNING: Namespace still exists after force cleanup"
        else
          echo "Namespace successfully deleted"
        fi
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      ignore_errors: true
      when: ns_wait.rc != 0

    - name: Clean up orphaned PersistentVolumes
      ansible.builtin.shell: |
        kubectl get pv -o json 2>/dev/null | jq -r '.items[] | select(.spec.claimRef.namespace=="airflow") | .metadata.name' 2>/dev/null | while read pv; do
          [ -n "$pv" ] && kubectl delete pv ${pv} 2>/dev/null || true
        done
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      ignore_errors: true
