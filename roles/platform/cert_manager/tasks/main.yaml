- name: Role Facts
  ansible.builtin.include_role:
    name: '{{ role }}'
    tasks_from: facts
  loop:
    - networking/external_dns
    - platform/cert_manager
    - bootstrap/k3s
  loop_control:
    loop_var: role

- name: Create namespaces
  kubernetes.core.k8s:
    state: present
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    definition: 
      - apiVersion: v1
        kind: Namespace
        metadata:
          name: cert-manager

- name: Deploy to argocd
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('ansible.builtin.template', 'argocd-deployment.yaml') | from_yaml }}"
    kubeconfig: /etc/rancher/k3s/k3s.yaml

- name: Wait for cert-manager CRDs to be available
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: clusterissuers.cert-manager.io
    kubeconfig: /etc/rancher/k3s/k3s.yaml
  register: crd_result
  retries: 30
  delay: 10
  until:
    - crd_result.resources is defined
    - crd_result.resources | length > 0

- name: Wait for cert-manager webhook to be ready
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: cert-manager-webhook
    namespace: cert-manager
    kubeconfig: /etc/rancher/k3s/k3s.yaml
  register: webhook_result
  retries: 30
  delay: 10
  until:
    - webhook_result.resources is defined
    - webhook_result.resources | length > 0
    - webhook_result.resources[0].status.readyReplicas is defined
    - webhook_result.resources[0].status.readyReplicas > 0

- name: Deploy Cert Issuer
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('ansible.builtin.template', 'cluster_issuer.j2') | from_yaml }}"
    kubeconfig: /etc/rancher/k3s/k3s.yaml

- name: Create ArgoCD Certificates
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('ansible.builtin.template', item ) | from_yaml }}"
    kubeconfig: /etc/rancher/k3s/k3s.yaml
  with_items:
    - ./templates/argocd-repo-server.yaml
    - ./templates/argocd-dex-server.yaml
    - ./templates/argocd-server.yaml
