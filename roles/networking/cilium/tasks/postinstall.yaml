---
- name: Role Post-Install
  when: inventory_hostname in k3s_map.server.hosts
  run_once: true
  block:
    - name: Hubble TLS Setup
      when: cilium_vars.kubernetes.hubble.tls.auto.method | lower == 'certmanager'
      block:
        - name: Create hubble certificate
          kubernetes.core.k8s:
            definition: "{{ lookup('ansible.builtin.template', 'hubble_certificate.j2') | from_yaml }}"
            kubeconfig: "{{ k3s_project.cluster.kubeconfig }}"
            wait: true

        - name: Create hubble cluster issuer
          kubernetes.core.k8s:
            definition: "{{ lookup('ansible.builtin.template', 'hubble_cluster_issuer.j2') | from_yaml }}"
            kubeconfig: "{{ k3s_project.cluster.kubeconfig }}"
            wait: true

    - name: Apply gateway-api crds manifest
      ansible.builtin.shell:
        cmd: |
          export KUBECONFIG='{{ k3s_project.cluster.kubeconfig }}'
          curl -fsSL '{{ cilium_project.release.gateway_api.url }}/{{ cilium_project.release.gateway_api.file }}' | kubectl apply -f - 2>&1
        executable: /bin/bash
      register: gateway_result
      retries: 3
      delay: 2
      until: gateway_result.rc == 0
      changed_when: "'created' in gateway_result.stdout or 'configured' in gateway_result.stdout"

    - name: Wait for Gateway CRDs to be established
      ansible.builtin.command:
        cmd: kubectl wait --for condition=established --timeout=60s crd/gateways.gateway.networking.k8s.io
      register: crd_wait
      retries: 3
      delay: 2
      until: crd_wait.rc == 0
      changed_when: false

    - name: Create gateway
      when: cilium_vars.kubernetes.hubble.ui.enabled is truthy
      kubernetes.core.k8s:
        definition: "{{ lookup('ansible.builtin.template', 'gateway.j2') | from_yaml }}"
        kubeconfig: "{{ k3s_project.cluster.kubeconfig }}"
        wait: true

    - name: Update chart setup fact
      ansible.builtin.set_fact:
        cilium_setup: false

    - name: Update chart postinstall fact
      ansible.builtin.set_fact:
        cilium_postinstall: true

    - name: Update chart postinstall values
      kubernetes.core.helm:
        chart_ref: "{{ cilium_map.helm.chart.reference }}"
        chart_version: "{{ cilium_vars.kubernetes.helm.chart.version }}"
        kubeconfig: "{{ k3s_project.cluster.kubeconfig }}"
        name: "{{ cilium_vars.kubernetes.helm.chart.name }}"
        namespace: "{{ cilium_vars.kubernetes.namespace }}"
        timeout: "{{ cilium_map.helm.timeout }}"
        values: "{{ lookup('ansible.builtin.template', 'values.j2') | from_yaml }}"
        wait: true
      register: cilium_result
      delay: 1
      retries: 3
      until: cilium_result is not failed
