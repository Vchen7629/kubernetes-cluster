---
- name: Uninstall cloudflared argocd app
  kubernetes.core.k8s:
    api_version: argoproj.io/v1alpha1
    state: absent
    kind: Application
    name: "cloudflared-{{ cf_tunnel_name }}"
    namespace: argocd

- name: Uninstall cloudflared manifests argocd app
  kubernetes.core.k8s:
    api_version: argoproj.io/v1alpha1
    state: absent
    kind: Application
    name: "{{ cf_tunnel_name }}-cloudflare-tunnel-crds"
    namespace: argocd

- name: Include tunnel facts variables
  ansible.builtin.include_vars:
    file: "{{ role_path }}/credentials/temp-{{ cf_tunnel_name }}.yaml"

- name: Get Cloudflare tunnel info
  ansible.builtin.uri:
    url: "https://api.cloudflare.com/client/v4/accounts/{{ account_id }}/cfd_tunnel/{{ tunnel_id }}"
    method: GET
    headers:
      Authorization: "Bearer {{ api_key }}"
      Content-Type: "application/json"
    return_content: true
  register: tunnel_status
  delegate_to: localhost
  become: false

- name: Disconnect active Cloudflare connectors
  ansible.builtin.uri:
    url: "https://api.cloudflare.com/client/v4/accounts/{{ account_id }}/cfd_tunnel/{{ tunnel_id }}/connections"
    method: DELETE
    headers:
      Authorization: "Bearer {{ api_key }}"
      Content-Type: "application/json"
  when: >
    tunnel_status.json.result.connections is defined and
    (tunnel_status.json.result.connections | length) > 0
  delegate_to: localhost
  become: false

- name: Wait for Cloudflare tunnel to disconnect
  ansible.builtin.uri:
    url: "https://api.cloudflare.com/client/v4/accounts/{{ account_id }}/cfd_tunnel/{{ tunnel_id }}"
    method: GET
    headers:
      Authorization: "Bearer {{ api_key }}"
      Content-Type: "application/json"
    return_content: true
  register: wait_tunnel_status
  until: wait_tunnel_status.json.result.connections | length == 0
  retries: 10
  delay: 5
  delegate_to: localhost
  become: false

- name: Delete existing Cloudflare tunnel if there are any
  ansible.builtin.uri:
    url: "https://api.cloudflare.com/client/v4/accounts/{{ account_id }}/cfd_tunnel/{{ tunnel_id }}"
    method: DELETE
    headers:
      Authorization: "Bearer {{ api_key }}"
      Content-Type: "application/json"
  delegate_to: localhost
  become: false

- name: Get DNS record ID for tunnel hostname
  ansible.builtin.uri:
    url: "https://api.cloudflare.com/client/v4/zones/{{ zone_id }}/dns_records?name={{ hostname }}"
    method: GET
    headers:
      Authorization: "Bearer {{ api_key }}"
      Content-Type: "application/json"
    return_content: true
  register: dns_records
  delegate_to: localhost
  become: false

- name: Delete DNS record for tunnel
  ansible.builtin.uri:
    url: "https://api.cloudflare.com/client/v4/zones/{{ zone_id }}/dns_records/{{ dns_records.json.result[0].id }}"
    method: DELETE
    headers:
      Authorization: "Bearer {{ api_key }}"
      Content-Type: "application/json"
  when: dns_records.json.result | length > 0
  delegate_to: localhost
  become: false

- name: Delete credentials file
  ansible.builtin.file:
    path: "{{ role_path }}/credentials/temp-{{ cf_tunnel_name }}.yaml"
    state: absent
  delegate_to: localhost
  become: false
