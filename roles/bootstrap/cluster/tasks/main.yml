---
- name: Role Validation
  ansible.builtin.import_tasks:
    file: validation.yml
  any_errors_fatal: true

- name: Cluster Provisioning
  block:
    - name: Cluster configuration
      ansible.builtin.import_tasks:
        file: configuration.yml

    - name: Upgrade cluster
      ansible.builtin.import_tasks:
        file: upgrade.yml

- name: Flush handlers
  ansible.builtin.meta: flush_handlers
