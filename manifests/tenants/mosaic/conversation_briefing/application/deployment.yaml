apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosaic-conversation-briefing-deployment
  labels:
    app.kubernetes.io/name: mosaic-conversation-briefing
    kubernetes.io/description: "deployment for mosaic conversation briefing service docker container, resources, and env variables"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: mosaic-conversation-briefing
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mosaic-conversation-briefing
    spec:
      containers:
        - name: mosaic-conversation-briefing
          image: ghcr.io/vchen7629/mosaic-conversation_briefing
          resources:                                                                                                                                                                                 
            requests:                                                                                                                                                                                
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "64Mi"
          env:
            # Non-sensitive config from ConfigMap
            - name: SERVER_PORT
              valueFrom:
                configMapKeyRef:
                  name: mosaic-conversation-briefing-config
                  key: SERVER_PORT
            - name: METRICS_PORT
              valueFrom:
                configMapKeyRef:
                  name: mosaic-conversation-briefing-config
                  key: METRICS_PORT
            - name: OLLAMA_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: mosaic-conversation-briefing-config
                  key: OLLAMA_BASE_URL
            - name: PROD_MODE
              valueFrom:
                configMapKeyRef:
                  name: mosaic-conversation-briefing-config
                  key: PROD_MODE
            # Sensitive data from Secrets
            # mosaic-postgres-cluster-app is auto-generated by CNPG with a correctly formatted uri
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mosaic-postgres-cluster-app
                  key: uri
            - name: CACHE_URL
              valueFrom:
                secretKeyRef:
                  name: mosaic-cache-url
                  key: cache_url
          readinessProbe:
            grpc:
              port: 30030
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3