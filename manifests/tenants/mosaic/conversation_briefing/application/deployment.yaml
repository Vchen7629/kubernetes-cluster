apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosaic-conversation-briefing-deployment
  annotations:
    kubernetes.io/description: "deployment for mosaic conversation briefing service docker container, resources, and env variables"
  labels:
    app.kubernetes.io/name: mosaic-conversation-briefing
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: mosaic-conversation-briefing
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mosaic-conversation-briefing
    spec:
      containers:
        - name: mosaic-conversation-briefing
          image: ghcr.io/vchen7629/mosaic-conversation_briefing
          resources:                                                                                                                                                                                 
            requests:                                                                                                                                                                                
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "64Mi"
          env:
            # Non-sensitive config from ConfigMap
            - name: SERVER_PORT
              valueFrom:
                configMapKeyRef:
                  name: mosaic-conversation-briefing-config
                  key: SERVER_PORT
            - name: METRICS_PORT
              valueFrom:
                configMapKeyRef:
                  name: mosaic-conversation-briefing-config
                  key: METRICS_PORT
            - name: OLLAMA_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: mosaic-conversation-briefing-config
                  key: OLLAMA_BASE_URL
            - name: PROD_MODE
              valueFrom:
                configMapKeyRef:
                  name: mosaic-conversation-briefing-config
                  key: PROD_MODE
            # Sensitive data from Secrets
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mosaic-db-credentials
                  key: password
            - name: DATABASE_URL
              value: "postgresql://app:$(DB_PASSWORD)@mosaic-postgres-cluster-rw.postgres.svc.cluster.local/mosaic"
            - name: CACHE_URL
              valueFrom:
                secretKeyRef:
                  name: mosaic-cache-url
                  key: cache_url
          readinessProbe:
            grpc:
              port: 30030
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 9