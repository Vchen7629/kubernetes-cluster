kind: Kustomization

resources:
  - application/config-map.yaml
  - application/deployment.yaml
  - application/service.yaml

  - grpc/route.yaml

  - network-policy/egress-to-data.yaml
  - network-policy/egress-to-kube-dns.yaml
  - network-policy/egress-to-ollama.yaml
  - network-policy/ingress-from-argocd.yaml
  - network-policy/ingress-from-host.yaml
  - network-policy/ingress-from-networking.yaml
