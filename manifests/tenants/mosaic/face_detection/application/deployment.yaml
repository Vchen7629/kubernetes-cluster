---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosaic-face-detection-deployment
  annotations:
    kubernetes.io/description: "deployment for mosaic face detection service docker container, resources, and env variables"
  labels:
    app.kubernetes.io/name: mosaic-face-detection
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: mosaic-face-detection
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mosaic-face-detection
    spec:
      containers:
        - name: mosaic-face-detection
          image: ghcr.io/vchen7629/mosaic-face_detection
          resources:
            limits:
              cpu: 2000m
              memory: 512Mi
            requests:
              cpu: 250m
              memory: 256Mi
          env:
            # Non-sensitive config from ConfigMap
            - name: SERVER_PORT
              valueFrom:
                configMapKeyRef:
                  name: mosaic-face-detection-config
                  key: SERVER_PORT
            - name: METRICS_PORT
              valueFrom:
                configMapKeyRef:
                  name: mosaic-face-detection-config
                  key: METRICS_PORT
            - name: MODELS_DIR
              valueFrom:
                configMapKeyRef:
                  name: mosaic-face-detection-config
                  key: MODELS_DIR
            - name: REC_POOL_SIZE
              valueFrom:
                configMapKeyRef:
                  name: mosaic-face-detection-config
                  key: REC_POOL_SIZE
            - name: PROD_MODE
              valueFrom:
                configMapKeyRef:
                  name: mosaic-face-detection-config
                  key: PROD_MODE
            # Sensitive data from Secrets
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mosaic-db-credentials
                  key: password
            - name: DATABASE_URL
              value: "postgresql://app:$(DB_PASSWORD)@mosaic-postgres-cluster-rw.postgres.svc.cluster.local/mosaic"
            - name: CACHE_URL
              valueFrom:
                secretKeyRef:
                  name: mosaic-cache-url
                  key: cache_url
          readinessProbe:
            grpc:
              port: 40040
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3