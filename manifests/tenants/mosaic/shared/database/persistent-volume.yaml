---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mosaic-postgres-pv
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: mosaic-storage
  volumeMode: Filesystem
  local:
    path: /mnt/k8s-data/mosaic-postgres
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - tiamat-rog-strix-g15ce-g15ce
