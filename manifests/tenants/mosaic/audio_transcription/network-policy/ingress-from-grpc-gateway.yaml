apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: mosaic-audio-transcription-grpc-ingress
  namespace: mosaic-audio-transcription
  annotations:
    kubernetes.io/description: allows grpc gateway to call the audio-transcription grpc endpoint
spec:
  endpointSelector:
    matchLabels:
      io.kubernetes.pod.namespace: mosaic-audio-transcription
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: mosaic-grpc-gateway
      fromEntities:
        - host
      toPorts:
        - ports:
            - port: "50051"
              protocol: TCP
