---
apiVersion: cilium.io/v2                                                                                                                                                                   
kind: CiliumNetworkPolicy                                                                                                                                                                  
metadata:
  name: mosaic-audio-transcription-to-huggingface                                                                                                                                          
  namespace: mosaic-audio-transcription
  annotations:
    kubernetes.io/description: "allow init container to download whisper model from HuggingFace"
    argocd.argoproj.io/sync-wave: "0"
spec:
  endpointSelector:
    matchLabels:
      io.kubernetes.pod.namespace: mosaic-audio-transcription
  egress:
    - toFQDNs:
        - matchName: "huggingface.co"
        - matchPattern: "*.huggingface.co"
        - matchPattern: "*.xethub.hf.co"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP