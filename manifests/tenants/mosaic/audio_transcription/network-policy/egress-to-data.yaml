apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: mosaic-audio-transcription-to-postgres-access
  namespace: mosaic-audio-transcription
  annotations:
    kubernetes.io/description: network policy allowing audio-transcrimosaic-audio-transcription to query postgres for data
spec:
  endpointSelector:
    matchLabels:
      io.kubernetes.pod.namespace: mosaic-audio-transcription
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: postgres
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
  
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: mosaic-audio-transcription-to-valkey-access
  annotations:
    kubernetes.io/description: network policy allowing mosaic audio-transcription to use valkey as cache
spec:
  endpointSelector:
    matchLabels:
      io.kubernetes.pod.namespace: mosaic-audio-transcription
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: valkey
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
