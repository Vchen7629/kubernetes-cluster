---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: mosaic-audio-transcription-grpc-ingress
  namespace: mosaic-audio-transcription
  annotations:
    kubernetes.io/description: allows grpc gateway to call the audio-transcription grpc endpoint
spec:
  endpointSelector:
    matchLabels:
      io.kubernetes.pod.namespace: mosaic-audio-transcription
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: mosaic-grpc-gateway
      toPorts:
        - ports:
            - port: "50051"
              protocol: TCP

---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: mosaic-audio-transcription-envoy-l7lb-ingress
  namespace: mosaic-audio-transcription
  annotations:
    kubernetes.io/description: allows cillium envoy l7lb to call the audio-transcription
spec:
  endpointSelector:
    matchLabels:
      io.kubernetes.pod.namespace: mosaic-audio-transcription
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "50051"
              protocol: TCP

---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: mosaic-audio-transcription-from-mosaic-cloudflare-tunnel-access
  namespace: mosaic-audio-transcription
  annotations:
    kubernetes.io/description: allows access from mosaic cloudflare tunnel
spec:
  endpointSelector:
    matchLabels:
      io.kubernetes.pod.namespace: mosaic-audio-transcription
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: cloudflare-tunnel-mosaic
      toPorts:
        - ports:
            - port: "50051"
              protocol: TCP
