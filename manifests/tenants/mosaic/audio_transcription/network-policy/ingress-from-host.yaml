---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: mosaic-audio-transcription-ingress-from-host
  annotations:
    kubernetes.io/description: allows kubelet grpc health checks (liveness/readiness probes) for audio transcription pods
spec:
  endpointSelector:
    matchLabels:
      io.kubernetes.pod.namespace: mosaic-audio-transcription
  ingress:
    # Allow grpc health checks from kubelet (host)
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "9091"
              protocol: TCP
            - port: "50051"
              protocol: TCP
