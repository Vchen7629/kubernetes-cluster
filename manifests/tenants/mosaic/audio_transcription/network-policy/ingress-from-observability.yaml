apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: mosaic-audio-transcription-api-metrics
  namespace: mosaic-audio-transcription
  annotations:
    kubernetes.io/description: allows vm to scrape the metrics endpoint for audio transcription service
    argocd.argoproj.io/sync-wave: "0"
spec:
  endpointSelector:
    matchLabels:
      io.kubernetes.pod.namespace: mosaic-audio-transcription
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: victoria-metrics
      toPorts:
        - ports:
            - port: "9091"
              protocol: TCP
