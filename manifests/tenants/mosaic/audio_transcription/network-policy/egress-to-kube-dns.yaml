apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: mosaic-audio-transcription-to-kube-dns-access
  namespace: mosaic-audio-transcription
  annotations:
    kubernetes.io/description: allow audio-transcription to perform DNS lookups via kube-dns
spec:
  endpointSelector:
    matchLabels:
      io.kubernetes.pod.namespace: mosaic-audio-transcription
  egress:
    - toEndpoints:
        - matchLabels:
            k8s-app: kube-dns
            io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
