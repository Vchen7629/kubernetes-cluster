---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: mosaic-audio-transcription-ingress-from-argocd
  namespace: mosaic-audio-transcription
  annotations:
    kubernetes.io/description: allows argocd to access the audio transcription service for health checks and sync operations
    argocd.argoproj.io/sync-wave: "0"
spec:
  endpointSelector:
    matchLabels:
      io.kubernetes.pod.namespace: mosaic-audio-transcription
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: argocd
      toPorts:
        - ports:
            - port: "9091"
              protocol: TCP
