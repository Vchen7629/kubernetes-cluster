---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: mosaic-audio-transcription-service-monitor
  namespace: victoria-metrics
  labels:
    app.kubernetes.io/instance: victoria-metrics
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: mosaic-audio-transcription
  namespaceSelector:
    matchNames:
      - mosaic-audio-transcription
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
