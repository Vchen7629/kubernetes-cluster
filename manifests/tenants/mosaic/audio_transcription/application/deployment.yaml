apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosaic-audio-transcription-deployment
  namespace: mosaic-audio-transcription
  annotations:
    kubernetes.io/description: "deployment for mosaic audio transcription service docker container, resources, and env variables"
  labels:
    app.kubernetes.io/name: mosaic-audio-transcription
spec:
  progressDeadlineSeconds: 900 # 15 mins
  selector:
    matchLabels:
      app.kubernetes.io/name: mosaic-audio-transcription
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mosaic-audio-transcription
    spec:
      nodeSelector:
        nvidia.com/gpu.present: "true"
      tolerations:
        - key: nvidia.com/gpu
          operator: Equal
          value: present
          effect: NoSchedule
      initContainers:
        - name: download-whisper-model
          image: ghcr.io/vchen7629/mosaic-audio_transcription
          command:
            - /app/.venv/bin/python
            - -c
            - |
              import os
              os.environ["HF_HUB_VERBOSITY"] = "info"
              from faster_whisper import WhisperModel
              import huggingface_hub
              huggingface_hub.logging.set_verbosity_info()
              cache_dir = "/root/.cache/huggingface/hub/models--Systran--faster-whisper-medium"
              incomplete = any(f.endswith(".incomplete") for f in os.listdir(cache_dir + "/blobs")) if os.path.exists(cache_dir + "/blobs") else False
              if not os.path.exists(cache_dir) or incomplete:
                  print("Downloading whisper medium model...")
                  WhisperModel("medium", device="cpu", compute_type="int8")
                  print("Done.", flush=True)
              else:
                  print("Model already cached, skipping.", flush=True)
          volumeMounts:
            - name: model-cache
              mountPath: /root/.cache/huggingface
      containers:
        - name: mosaic-audio-transcription
          image: ghcr.io/vchen7629/mosaic-audio_transcription
          resources:                                                                                                                                                                                 
            requests:                                                                                                                                                                                
              memory: "550Mi"
              cpu: "0.05m"
            limits:
              memory: "1200Mi"
          env:
            # Non-sensitive config from ConfigMap
            - name: SERVER_PORT
              valueFrom:
                configMapKeyRef:
                  name: mosaic-audio-transcription-config
                  key: SERVER_PORT
            - name: METRICS_PORT
              valueFrom:
                configMapKeyRef:
                  name: mosaic-audio-transcription-config
                  key: METRICS_PORT
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: mosaic-audio-transcription-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: mosaic-audio-transcription-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: mosaic-audio-transcription-config
                  key: DB_NAME
            - name: DB_USER
              value: "app"
            - name: VALKEY_HOST
              valueFrom:
                configMapKeyRef:
                  name: mosaic-audio-transcription-config
                  key: VALKEY_HOST
            - name: VALKEY_PORT
              valueFrom:
                configMapKeyRef:
                  name: mosaic-audio-transcription-config
                  key: VALKEY_PORT 
            # Sensitive data from Secrets
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: mosaic-db-credentials
                  key: password
          readinessProbe:
            httpGet:
              path: /ready
              port: 9091
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - name: model-cache
              mountPath: /root/.cache/huggingface
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: mosaic-audio-transcription-whisper-model-cache