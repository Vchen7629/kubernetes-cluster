apiVersion: v1
kind: Service
metadata:
  name: audio-transcription-service
  namespace: mosaic-audio-transcription
  labels:
    app.kubernetes.io/name: mosaic-audio-transcription
  annotations:
    kubernetes.io/description: "Exposes an port for the pod for rest of cluster access to this service"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mosaic-audio-transcription
  ports:
    - port: 9091
      targetPort: 9091
      protocol: TCP
      name: metrics
    - port: 50051
      targetPort: 50051
      protocol: TCP
      name: grpc
