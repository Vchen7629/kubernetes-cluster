apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: audio-transcription-grpc
  namespace: mosaic-audio-transcription
spec:
  parentRefs:
  - name: mosaic-grpc-gateway
    namespace: mosaic-grpc-gateway
  hostnames:
  - "api.verturus.com"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /proto.audio_transcription.AudioTranscriptionService/
    backendRefs:
    - name: audio-transcription-service
      port: 50051
