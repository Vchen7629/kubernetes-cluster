---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cyphria-sentiment-analysis-deployment
  labels:
    app.kubernetes.io/name: cyphria-sentiment-analysis
    kubernetes.io/description: "deployment for cyphria sentiment analysis docker container, specifies resources"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: cyphria-sentiment-analysis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cyphria-sentiment-analysis
    spec:
      containers:
        - name: cyphria-sentiment-analysis
          image: ghcr.io/vchen7629/cyphria-sentiment-analysis
          resources:
            limits:
              memory: 1024Mi
            requests:
              cpu: 256m
              memory: 512Mi
          env:
            # Non-sensitive config from ConfigMap
            - name: PRODUCTION_MODE
              valueFrom:
                configMapKeyRef:
                  name: cyphria-sentiment-analysis-config
                  key: PRODUCTION_MODE
            - name: FASTAPI_PORT
              valueFrom:
                configMapKeyRef:
                  name: cyphria-sentiment-analysis-config
                  key: FASTAPI_PORT
            - name: SENTIMENT_BATCH_SIZE
              valueFrom:
                configMapKeyRef:
                  name: cyphria-sentiment-analysis-config
                  key: SENTIMENT_BATCH_SIZE
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: cyphria-sentiment-analysis-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: cyphria-sentiment-analysis-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: cyphria-sentiment-analysis-config
                  key: DB_NAME
            # Sensitive data from Secrets
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: cyphria-user-secret
                  key: username
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: cyphria-user-secret
                  key: password
