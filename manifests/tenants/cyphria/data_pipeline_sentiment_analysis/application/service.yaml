apiVersion: v1
kind: Service
metadata:
  name: cyphria-sentiment-analysis-service
  annotations:
    kubernetes.io/description: "Exposes an port for the pod for rest of cluster access to this service"
spec:
  type: ClusterIP
  selector: 
    app.kubernetes.io/name: cyphria-sentiment-analysis
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
