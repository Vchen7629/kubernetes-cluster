---
apiVersion: v1
kind: Service
metadata:
  name: cyphria-frontend-service
  annotations:
    kubernetes.io/description: "Exposes an port for the pod for rest of cluster access to this service"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cyphria-frontend
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
      name: http
