apiVersion: apps/v1
kind: Deployment
metadata:
  name: cyphria-insights-api-deployment
  labels:
    app.kubernetes.io/name: cyphria-insights-api
    kubernetes.io/description: "deployment for cyphria insights api docker container, specifies resources"
spec: 
  selector:
    matchLabels:
      app.kubernetes.io/name: cyphria-insights-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cyphria-insights-api
    spec:
      containers:
        - name: cyphria-insights-api
          image: ghcr.io/vchen7629/cyphria-insights-api
          resources:
            limits:
              memory: 1024Mi
            requests: 
              cpu: 250m
              memory: 512Mi
