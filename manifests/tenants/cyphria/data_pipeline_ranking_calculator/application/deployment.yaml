---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cyphria-ranking-calculator-deployment
  labels:
    app.kubernetes.io/name: cyphria-ranking-calculator
    kubernetes.io/description: "deployment for cyphria ranking calculator docker container, specifies resources"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: cyphria-ranking-calculator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cyphria-ranking-calculator
    spec:
      containers:
        - name: cyphria-ranking
          image: ghcr.io/vchen7629/cyphria-ranking-calculator
          resources:
            limits:
              memory: 1024Mi
            requests:
              cpu: 125m
              memory: 512Mi
          env:
            # Non-sensitive config from ConfigMap
            - name: PRODUCTION_MODE
              valueFrom:
                configMapKeyRef:
                  name: cyphria-ranking-calculator-config
                  key: PRODUCTION_MODE
            - name: FASTAPI_PORT
              valueFrom:
                configMapKeyRef:
                  name: cyphria-ranking-calculator-config
                  key: FASTAPI_PORT
            - name: BAYESIAN_PARAMS
              valueFrom:
                configMapKeyRef:
                  name: cyphria-ranking-calculator-config
                  key: BAYESIAN_PARAMS
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: cyphria-ranking-calculator-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: cyphria-ranking-calculator-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: cyphria-ranking-calculator-config
                  key: DB_NAME
            # Sensitive data from Secrets
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: cyphria-user-secret
                  key: username
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: cyphria-user-secret
                  key: password