apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cyphria-data-ingestion-to-postgres-access
  namespace: cyphria-data-pipeline
  annotations:
    kubernetes.io/description: network policy allowing data ingestion to call postgres to save data
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: cyphria-data-ingestion
      io.kubernetes.pod.namespace: cyphria-data-pipeline
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: postgres
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP

