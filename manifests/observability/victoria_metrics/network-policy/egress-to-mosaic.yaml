---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: vmagent-to-mosaic-audio-transcription-access
  namespace: victoria-metrics
  annotations:
    kubernetes.io/description: allows vmagent to scrape mosaic audio transcription metrics
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: vmagent
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: mosaic-audio-transcription
      toPorts:
        - ports:
            - port: "9091"
              protocol: TCP

