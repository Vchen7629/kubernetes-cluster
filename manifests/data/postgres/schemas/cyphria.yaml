---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cyphria-init-schema
  namespace: postgres
data:
  # This script runs in the 'cyphria' database context during CNPG bootstrap
  # The database and user are already created by initdb
  schema.sql: |
    -- Enable extensions
    CREATE EXTENSION IF NOT EXISTS pg_trgm;

    -- Bronze Layer Table
    CREATE TABLE IF NOT EXISTS raw_comments (
        id SERIAL PRIMARY KEY,
        comment_id VARCHAR(50) UNIQUE NOT NULL,
        post_id VARCHAR(50) NOT NULL,
        comment_body TEXT NOT NULL,
        detected_products TEXT[] NOT NULL,
        subreddit VARCHAR(100) NOT NULL,
        author VARCHAR(100),
        score INT DEFAULT 0,
        created_utc TIMESTAMPTZ NOT NULL,
        product_topic VARCHAR(50) NOT NULL,
        ingested_at TIMESTAMPTZ DEFAULT NOW(),
        sentiment_processed BOOLEAN DEFAULT FALSE,

        CONSTRAINT chk_detected_products CHECK (array_length(detected_products, 1) > 0)
    );

    -- Silver Layer Table
    CREATE TABLE IF NOT EXISTS product_sentiment (
        id SERIAL PRIMARY KEY,
        comment_id VARCHAR(50) NOT NULL,
        product_name VARCHAR(100) NOT NULL,
        product_topic VARCHAR(100) NOT NULL,
        sentiment_score FLOAT NOT NULL,
        created_utc TIMESTAMPTZ NOT NULL,

        UNIQUE (comment_id, product_name)
    );

    -- Gold Layer Table
    CREATE TABLE IF NOT EXISTS product_rankings (
        id SERIAL PRIMARY KEY,
        product_name VARCHAR(50) NOT NULL,
        product_topic VARCHAR(100) NOT NULL,
        time_window VARCHAR(20) NOT NULL,

        rank INTEGER NOT NULL,
        grade VARCHAR(5),

        bayesian_score DOUBLE PRECISION NOT NULL,
        avg_sentiment DOUBLE PRECISION NOT NULL,
        approval_percentage INT,

        mention_count INTEGER NOT NULL,
        positive_count INTEGER,
        negative_count INTEGER,
        neutral_count INTEGER,

        is_top_pick BOOLEAN DEFAULT FALSE,
        is_most_discussed BOOLEAN DEFAULT FALSE,
        has_limited_data BOOLEAN DEFAULT FALSE,

        calculation_date DATE NOT NULL,
        UNIQUE (product_name, time_window)
    );

    -- Index for fetching unprocessed comments by topic
    CREATE INDEX IF NOT EXISTS idx_raw_comments_unprocessed_by_topic
        ON raw_comments(product_topic, created_utc)
        WHERE sentiment_processed = FALSE;

    -- Index for detected_products array searches (GIN index for array containment)
    CREATE INDEX IF NOT EXISTS idx_raw_comments_detected_products
        ON raw_comments USING GIN(detected_products);

    -- Index for product-based aggregation
    CREATE INDEX IF NOT EXISTS idx_product_sentiment_product_topic
        ON product_sentiment(product_topic, product_name);

    -- Index for searching product names (GIN trigram for fast ILIKE searches)
    CREATE INDEX IF NOT EXISTS idx_product_name_trgm
        ON product_rankings USING GIN(product_name gin_trgm_ops);

    -- Index for fetching products by topic, time window, and rank
    CREATE INDEX IF NOT EXISTS idx_product_rankings_topic_window
        ON product_rankings(product_topic, time_window, rank);
