apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: postgres-from-insights-api-access
  namespace: postgres
  annotations:
    kubernetes.io/description: allows insights api to send requests to postgres to fetch data
spec:
  endpointSelector:
    matchExpressions:
      - key: cnpg.io/cluster
        operator: Exists
      - key: app.kubernetes.io/instance
        operator: In
        values:
          - postgres
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: cyphria-backend
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP

