---
apiVersion: v1
kind: ConfigMap
metadata:
  name: airflow-init-schema
  namespace: postgres
data:
  schema.sql: |-
    -- Airflow will create its own tables on first run
    -- This file can be used for any pre-initialization needed
    -- For now, just ensure the airflow_user has proper permissions

    -- Grant all privileges on the database to airflow_user (already owner, but being explicit)
    GRANT ALL PRIVILEGES ON DATABASE airflow TO airflow_user;

    -- Grant schema usage
    GRANT ALL ON SCHEMA public TO airflow_user;
